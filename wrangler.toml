name = "vpd-chart-service"
main = "worker.js"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

# Include font files in the deployment
[[ rules ]]
type = "Text"
globs = ["**/*.ttf"]
fallthrough = true

# Don't bundle canvas - let Workers use it via nodejs_compat
[[ rules ]]
type = "CompiledWasm"
globs = ["**/*.wasm"]
fallthrough = true
